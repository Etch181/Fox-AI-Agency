# ============================================================
# FOX AI AGENCY — GitHub Actions CI
# ============================================================
# Runs validation gates on pull requests and branch pushes.
# Uses synthetic Firebase project for emulator tests.
# Does NOT deploy, does NOT require production secrets.
# ============================================================

name: CI — Validation & Security Gates

on:
  pull_request:
    branches:
      - "safety/**"
      - "main"
  push:
    branches:
      - "safety/**"

env:
  FIRESTORE_PROJECT_ID: demo-fox-ai-staging
  FIRESTORE_DATABASE_ID: "(default)"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (TypeScript)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start Firestore emulator
        run: |
          npx firebase emulators:start \
            --only firestore \
            --project ${{ env.FIRESTORE_PROJECT_ID }} \
            --config firestore.rules \
            &
          echo "firestore_emulator_pid=$!" >> $GITHUB_ENV
          # Wait for emulator to be ready
          timeout 60 bash -c 'until curl -s localhost:8080 > /dev/null 2>&1; do sleep 2; done'
        env:
          FIRESTORE_PROJECT_ID: ${{ env.FIRESTORE_PROJECT_ID }}

      - name: Run Firestore rules tests
        run: npm run test:firestore-rules
        env:
          FIRESTORE_PROJECT_ID: ${{ env.FIRESTORE_PROJECT_ID }}

      - name: Stop Firestore emulator
        if: always()
        run: kill $firestore_emulator_pid 2>/dev/null || true

      - name: Run unit/integration tests
        run: npm test

      - name: Docker build validation (if Dockerfile exists)
        run: |
          if [ -f "Dockerfile" ]; then
            docker build -t fox-ai-agency:ci .
          fi

      - name: Docker Compose config validation (if compose exists)
        run: |
          if [ -f "docker-compose.staging.yml" ]; then
            docker compose -f docker-compose.staging.yml config --quiet
          fi

  security-review:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Scan for staged secrets
        run: |
          # Check that no real values are staged in .env* files
          git grep -I '^[A-Z_]*=.*[^=].*$' -- '.env*' '!.env.example' '!.env.staging.example' || echo "No real .env values found"

      - name: Validate Dockerfile has no secrets
        run: |
          if [ -f "Dockerfile" ]; then
            grep -i 'password\|secret\|token\|credential' Dockerfile | grep -v 'no-new-privileges\|ENV\|#\|ARG\|example\|placeholder\|env var\|environment\|feature\|flag\|no secret\|secrets.*not\|no-secret' || echo "Dockerfile clean"
          fi
