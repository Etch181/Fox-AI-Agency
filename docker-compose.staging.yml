# ============================================================
# FOX AI AGENCY — Staging Docker Compose
# ============================================================
# This file defines a staging-oriented deployment with:
#   - FOX application container (behind internal Nginx if added)
#   - Isolated Docker network
#   - Secrets via environment variables (mounted from .env)
#   - Healthcheck
#   - No privileged mode, no host networking, no socket mounts
# ============================================================

name: fox-ai-agency-staging

services:
  fox-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fox-ai-agency:staging
    container_name: fox-ai-agency-staging
    
    # Bind to localhost inside the host; Nginx proxies to this port
    ports:
      - "127.0.0.1:4000:3000"
    
    env_file:
      - .env.staging
    
    environment:
      # Override runtime settings for staging
      NODE_ENV: production
      FOX_INTERNAL_PORT: 3000
      FOX_LISTEN_HOST: 0.0.0.0
      # Integrations disabled by default (fail-safe)
      ENABLE_TELEGRAM: false
      ENABLE_META: false
      ENABLE_SMTP: false
      ENABLE_EXTERNAL_CRM: false
      ENABLE_N8N: false
    
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://127.0.0.1:3000/api/health',(res)=>{if(res.statusCode===200){process.exit(0)}else{process.exit(1)}}).on('error',()=>process.exit(1));setTimeout(()=>{process.exit(1)},4000);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    
    # Isolated network only
    networks:
      - fox-staging
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

networks:
  fox-staging:
    driver: bridge
    internal: true
